# Runs on every push and pull request. Railway deployments are configured independently
# from these GitHub Actions checks; see DEPLOY.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the whole git history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:postgres@localhost:5432/test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Install
        run: |
          pip install -r requirements-dev.txt -c constraints.txt
          python -m playwright install --with-deps chromium
      - name: Test
        run: python -m pytest -q

  docker:
    name: Docker image builds and /health answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t resume-parser:ci .
      - name: Start the container (local mode, SQLite)
        run: |
          docker run -d --name app -p 8000:8000 -e APP_ENV=development -e PORT=8000 resume-parser:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health | python3 -c "import sys, json; h = json.load(sys.stdin); assert h['status'] == 'ok' and h['database'] and h['ocr_available'], h; print('health OK', h)"
          curl -fsS -o /dev/null http://127.0.0.1:8000/
      - name: Chromium and Tesseract work inside the image
        run: |
          docker exec app python -c "from app.pipeline.render import html_to_pdf; pdf = html_to_pdf('<h1>ok</h1>'); assert pdf.startswith(b'%PDF'); print('PDF export OK', len(pdf), 'bytes')"
          docker exec app tesseract --version
      - name: Logs on failure
        if: failure()
        run: docker logs app
