# Optional Render Blueprint. The primary deployment walkthrough is for Railway in DEPLOY.md.
# Set sensitive values in the Render dashboard when prompted; do not put credentials here.
services:
  - type: web
    name: resume-parser
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: SENTRY_DSN
        sync: false
      - key: APP_NAME
        value: Resume Parser
      - key: COMPANY_NAME
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: MATCH_SEMANTIC_SIMILARITY
        value: "true"
      - key: LOG_LEVEL
        value: INFO
