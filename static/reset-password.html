<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a new password · {{APP_NAME}}</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/site.css">
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/static/auth.js"></script>
<style>
  main { min-height: calc(100vh - 160px); display: grid; place-items: center; padding: 24px 0; }
  .login { width: 100%; max-width: 420px; display: grid; gap: 16px; }
  .login h1 { margin: 0; font-size: 26px; }
  form { display: grid; gap: 10px; }
  form[hidden] { display: none; }
  .fine { font-size: 13px; }
  .pw { position: relative; }
  .pw input.field { padding-right: 64px; }
  .pw .toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font: inherit; font-size: 13px; font-weight: 600;
    border: 0; background: none; color: var(--accent); cursor: pointer; padding: 6px 8px; }
</style>
</head>
<body>
<div class="wrap"><nav class="nav"><a class="brand" href="/"><img src="/static/favicon.svg" alt="">{{APP_NAME}}</a></nav></div>
<main class="wrap">
  <div class="card login">
    <div>
      <h1>Set a new password</h1>
      <p class="muted" style="margin:6px 0 0" id="who">Checking your reset link…</p>
    </div>
    <div id="msg" role="status" aria-live="polite" hidden></div>
    <form id="reset-form" hidden>
      <label for="password" class="muted fine">New password</label>
      <div class="pw">
        <input class="field" id="password" name="password" type="password" autocomplete="new-password" required minlength="8" aria-describedby="pw-hint">
        <button type="button" class="toggle" aria-controls="password" aria-pressed="false">Show</button>
      </div>
      <label for="confirm" class="muted fine">Repeat new password</label>
      <div class="pw">
        <input class="field" id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="8">
        <button type="button" class="toggle" aria-controls="confirm" aria-pressed="false">Show</button>
      </div>
      <p class="muted fine" id="pw-hint" style="margin:0">At least 8 characters.</p>
      <button class="btn primary" type="submit">Save new password</button>
    </form>
    <p class="muted fine" style="margin:0" id="again" hidden><a href="/login#forgot">Request a new reset link</a> · <a href="/login">Back to log in</a></p>
  </div>
</main>
<footer><div class="wrap"><span>© {{YEAR}} {{COMPANY}}</span><span class="grow"></span><a href="/privacy">Privacy</a><a href="/terms">Terms</a></div></footer>
<script>
"use strict";
const msg = document.getElementById("msg");
const form = document.getElementById("reset-form");

function show(kind, text) {
  msg.className = `alert ${kind}`;
  msg.textContent = text;
  msg.hidden = false;
}

function linkProblem(text) {
  document.getElementById("who").textContent = "This reset link can't be used.";
  show("bad", text);
  document.getElementById("again").hidden = false;
}

(async () => {
  if (!Auth.enabled) { location.replace("/app"); return; }  // local mode: no accounts, no passwords
  const params = new URLSearchParams(location.search);
  const hash = new URLSearchParams(location.hash.slice(1));
  const error = params.get("error_description") || hash.get("error_description");
  if (error) return linkProblem(Auth.friendlyError({ code: params.get("error_code") || hash.get("error_code") || "", message: error }));
  // The emailed link lands here with ?code=...; supabase-js exchanges it for a short "recovery" session.
  const session = await Auth.session();
  if (!session) return linkProblem("This link has expired or was already used. Links only work in the browser where you asked for them.");
  history.replaceState(null, "", "/reset-password");  // drop the one-time code from the address bar
  document.getElementById("who").textContent = `For ${session.user.email}.`;
  form.hidden = false;
  form.password.focus();
})();

document.querySelectorAll(".pw .toggle").forEach((toggle) => toggle.addEventListener("click", () => {
  const input = document.getElementById(toggle.getAttribute("aria-controls"));
  const visible = input.type === "password";
  input.type = visible ? "text" : "password";
  toggle.textContent = visible ? "Hide" : "Show";
  toggle.setAttribute("aria-pressed", String(visible));
}));

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const password = form.password.value;
  if (password.length < Auth.MIN_PASSWORD) return show("bad", `Your password must be at least ${Auth.MIN_PASSWORD} characters.`);
  if (password !== form.confirm.value) return show("bad", "The two passwords don't match.");
  const button = form.querySelector("button[type=submit]");
  button.disabled = true;
  const { error } = await Auth.updatePassword(password);
  if (error) { button.disabled = false; return show("bad", Auth.friendlyError(error)); }
  form.hidden = true;
  show("ok", "Password updated. Taking you to the app…");
  setTimeout(() => location.replace("/app"), 1500);
});
</script>
</body>
</html>
