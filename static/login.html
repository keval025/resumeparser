<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · {{APP_NAME}}</title>
<meta name="description" content="Sign in to {{APP_NAME}} with Google or a magic link sent to your email.">
<meta name="robots" content="noindex">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/site.css">
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/static/auth.js"></script>
<style>
  main { min-height: calc(100vh - 160px); display: grid; place-items: center; padding: 24px 0; }
  .login { width: 100%; max-width: 420px; display: grid; gap: 16px; }
  .login h1 { margin: 0; font-size: 26px; }
  .or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
  .or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
  form { display: grid; gap: 10px; }
  .fine { font-size: 13px; }
</style>
</head>
<body>
<div class="wrap"><nav class="nav"><a class="brand" href="/"><img src="/static/favicon.svg" alt="">{{APP_NAME}}</a></nav></div>
<main class="wrap">
  <div class="card login">
    <div>
      <h1>Sign in</h1>
      <p class="muted" style="margin:6px 0 0">New here? Signing in creates your free account.</p>
    </div>
    <div id="msg" hidden></div>
    <button class="btn big" id="google" type="button">
      <svg class="g-icon" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.5 5.8c4.4-4 6.8-10 6.8-17.2z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
      Continue with Google
    </button>
    <div class="or">or</div>
    <form id="email-form">
      <label for="email" class="muted fine">Email address</label>
      <input class="field" id="email" type="email" autocomplete="email" required placeholder="you@example.com">
      <button class="btn primary" id="email-btn" type="submit">Email me a sign-in link</button>
    </form>
    <p class="muted fine" style="margin:0">By signing in you agree to the <a href="/terms">Terms</a> and the <a href="/privacy">Privacy Policy</a>.</p>
  </div>
</main>
<footer><div class="wrap"><span>© {{YEAR}} {{COMPANY}}</span><span class="grow"></span><a href="/privacy">Privacy</a><a href="/terms">Terms</a></div></footer>
<script>
"use strict";
const params = new URLSearchParams(location.search);
const next = Auth.safeNext(params.get("next") || "/app");
const msg = document.getElementById("msg");

function show(kind, text) {
  msg.className = `alert ${kind}`;
  msg.textContent = text;
  msg.hidden = false;
}

(async () => {
  if (!Auth.enabled) { location.replace("/app"); return; }      // local mode: no login
  if (await Auth.session()) { location.replace(next); return; }  // already signed in
  if (params.get("reason") === "expired") show("bad", "Your session expired. Please sign in again.");
  const error = params.get("error_description") || new URLSearchParams(location.hash.slice(1)).get("error_description");
  if (error) show("bad", error);
})();

document.getElementById("google").addEventListener("click", async (e) => {
  e.currentTarget.disabled = true;
  const { error } = await Auth.signInWithGoogle(next);
  if (error) { show("bad", error.message); e.currentTarget.disabled = false; }
});

document.getElementById("email-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const button = document.getElementById("email-btn");
  const email = document.getElementById("email").value.trim();
  button.disabled = true;
  const { error } = await Auth.signInWithEmail(email, next);
  button.disabled = false;
  if (error) return show("bad", error.message);
  show("ok", `Check ${email}: we sent you a sign-in link. Open it in this same browser.`);
});
</script>
</body>
</html>
